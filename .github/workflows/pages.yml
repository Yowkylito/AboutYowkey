name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the history, not just the tip
          persist-credentials: false # nothing after this pushes, so the build's tools never see the token

      # The CLI, not gitleaks-action: on a branch's first push the action scans `<first commit>^..<last>`, and a
      # root commit has no parent, so git errors and the step fails having scanned nothing. This scans all history.
      # The download is checked against the release's own gitleaks_<version>_checksums.txt before it runs.
      - name: Scan for committed secrets
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # generateStaticSite runs inside wasmJsBrowserDistribution and fails the build on malformed portfolio.json.
      - name: Test and build
        run: ./gradlew :composeApp:jvmTest :composeApp:wasmJsBrowserDistribution --stacktrace

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: composeApp/build/dist/wasmJs/productionExecutable
          if-no-files-found: error
          retention-days: 7

  # The owner's Android app (androidApp/). Built from a clean checkout, so with no Firebase config: the APK it uploads
  # has push off and the 15-minute backup check on, which is the build CI must keep green. ubuntu-latest has the
  # Android SDK; AGP fetches a missing platform itself.
  android:
    name: Build the Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build the debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yowkey-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # Cloudflare Pages, project `aboutyowkey` (https://aboutyowkey.pages.dev/): the repository is private, and GitHub
  # Pages serves a private repository only on a paid plan. Until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
  # secrets exist the deploy is skipped with a note, and the site is deployed from a Mac (docs/DEVELOPMENT.md, Deploy).
  deploy:
    name: Deploy to Cloudflare Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}
    env:
      # Whether the token is set, never the token: only the Deploy step has it.
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Explain the skip until the secrets exist
        if: env.HAS_CLOUDFLARE_TOKEN != 'true'
        run: |
          echo "Not deployed: the CLOUDFLARE_API_TOKEN secret is not set. See docs/DEVELOPMENT.md, Deploy." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        with:
          name: site
          path: site
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        with:
          node-version: 22
      - name: Deploy
        id: deploy
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.152.0 pages deploy site --project-name aboutyowkey --branch main --commit-dirty=true

  lighthouse:
    name: Lighthouse on the live site
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: https://aboutyowkey.pages.dev/
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true
