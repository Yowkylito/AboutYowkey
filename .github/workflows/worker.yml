name: Worker

# The site's backend (worker/). Its tests run on every change; the deploy runs on main once the Cloudflare secrets
# exist (README.md, "Visits and feedback"), and is a no-op until then.
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  pull_request:
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: worker

jobs:
  test:
    name: Test the worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm test

  deploy:
    name: Deploy to Cloudflare
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    env:
      # Whether the token is set, never the token: only the Deploy step has it, so `npm ci`'s install scripts do not.
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Explain the skip until the secrets exist
        if: env.HAS_CLOUDFLARE_TOKEN != 'true'
        run: |
          echo "Not deployed: the CLOUDFLARE_API_TOKEN secret is not set. See README.md, Visits and feedback." >> "$GITHUB_STEP_SUMMARY"
      - name: Install wrangler
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        run: npm ci
      - name: Deploy
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
