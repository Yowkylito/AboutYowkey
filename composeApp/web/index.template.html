<!doctype html>
<!--
  Template for the generateStaticSite Gradle task. The double-brace placeholders are filled from portfolio.json; do not edit
  the generated build/generated/site/index.html.

  Boot: the static <main> is a full, crawlable version of the page and shows first. If the browser supports
  WasmGC, composeApp.js loads the Compose app into #app (invisible), and once it has drawn real content Kotlin
  adds body.app-ready, which swaps the two. Without WasmGC, or if the script fails, the static page simply stays.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{url}}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:site_name" content="{{name}}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script type="application/ld+json">{{jsonLd}}</script>
  <style>
    :root {
      --bg: #F7F5F0; --surface: #FFFFFF; --ink: #16181D; --muted: #545A66; --line: #E4E0D7; --accent: #C2410C;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0E1014; --surface: #161A20; --ink: #ECEDEF; --muted: #9AA1AD; --line: #262B33; --accent: #FB923C; }
    }
    * { box-sizing: border-box; }
    /*
      The page itself never scrolls: #static-scroll does. A body scrollbar would make the viewport narrower while
      the static page shows, Compose would size its canvas to that, and the canvas would stay stretched after the
      scrollbar left at hand-off.
    */
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); }
    #static-scroll { position: fixed; inset: 0; overflow-y: auto; }
    body {
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #static-content { max-width: 1120px; margin: 0 auto; padding: 96px 20px 120px; }
    .hero h1 { font-size: clamp(44px, 9vw, 72px); line-height: 1.05; letter-spacing: -0.03em; margin: 8px 0 16px; }
    .headline { font-size: clamp(20px, 3vw, 24px); margin: 0 0 12px; max-width: 720px; }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; margin: 0; }
    .muted { color: var(--muted); }
    section { margin-top: 96px; }
    h2 { font-size: 28px; letter-spacing: -0.01em; margin: 0 0 24px; }
    h3 { font-size: 19px; margin: 0 0 4px; }
    .cards { list-style: none; padding: 0; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .cards li, article { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
    article + article { margin-top: 16px; }
    a { color: var(--accent); font-weight: 600; }
    .shots { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
    .shots img { display: block; height: 200px; width: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--line); }
    .links a { display: inline-block; margin: 0 16px 8px 0; padding: 12px 0; }
    #app { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
    .loading-bar {
      position: fixed; top: 0; left: 0; height: 3px; width: 40%; background: var(--accent);
      animation: loading 1.4s ease-in-out infinite;
    }
    @keyframes loading { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .loading-bar { animation: none; width: 100%; opacity: .5; } }
    body.app-ready #app { opacity: 1; pointer-events: auto; }
    body.app-ready #static-scroll, body.app-ready .loading-bar,
    body.static-only #app, body.static-only .loading-bar { display: none; }
  </style>
</head>
<body>
  <div class="loading-bar" aria-hidden="true"></div>
  <div id="static-scroll">
    <main id="static-content">
{{content}}
    </main>
  </div>
  <div id="app" aria-hidden="true"></div>
  <script>
    (function () {
      // A minimal module declaring a GC struct type: validates only where WasmGC (required by Kotlin/Wasm) exists.
      var gc = typeof WebAssembly === "object" &&
        WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]));
      function staticOnly() { document.body.classList.add("static-only"); }
      if (!gc) return staticOnly();
      var script = document.createElement("script");
      script.src = "composeApp.js";
      script.onerror = staticOnly;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
