<!doctype html>
<!--
  Template for the generateStaticSite Gradle task. The double-brace placeholders are filled from portfolio.json, except
  {{build}}, the id of the build (the git commit); do not edit the generated build/generated/site/index.html.

  Boot: the static <main> is a full, crawlable version of the page and shows first. If the browser supports
  WasmGC, composeApp.js loads the Compose app into #app (invisible), and once it has drawn real content Kotlin
  adds body.app-ready, which fades the app in over it. Without WasmGC, or if the script fails, the static page
  simply stays.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{url}}">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FAFAFA">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:site_name" content="{{name}}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script type="application/ld+json">{{jsonLd}}</script>
  <script>
    // The page is light unless the visitor switched to dark: the "theme" key in localStorage, "light" or "dark",
    // which the app's switch writes too. It is applied here, before the first paint, so a saved theme never flashes
    // the other one; the app calls applyTheme again on a switch, so the page under its canvas and the browser's own
    // chrome follow. The colours match ui/theme/Theme.kt.
    window.applyTheme = function (theme) {
      var dark = theme === "dark";
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", dark ? "#0C0E13" : "#FAFAFA");
    };
    try { window.applyTheme(localStorage.getItem("theme")); } catch (e) { window.applyTheme("light"); }
    // Marks the page as scripted before the first paint too, so the bar's parts that only the script can work (the
    // theme switch, the compact menu) take their places from the start rather than shifting the page once it runs.
    document.documentElement.classList.add("js");
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #FAFAFA; --surface: #FFFFFF; --ink: #09090B; --muted: #475569; --line: #E4E4E7; --line-strong: #D4D4D8;
      --accent: #2563EB; --on-accent: #FFFFFF;
      /* Added for the bar: the monogram's deeper end. */
      --accent-deep: #1D4ED8;
      /* The hero portrait's stage and its sound lines: the app's primaryContainer and onPrimaryContainer. */
      --stage: #DBEAFE; --shout: #1E3A8A;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0C0E13; --surface: #15181F; --ink: #F4F4F5; --muted: #A1A1AA; --line: #27272A; --line-strong: #3F3F46;
      --accent: #60A5FA; --on-accent: #0B1D3F;
      --accent-deep: #3B82F6;
      --stage: #1E3A8A; --shout: #BFDBFE;
    }
    * { box-sizing: border-box; }
    /*
      The page itself never scrolls: #static-scroll does. A body scrollbar would make the viewport narrower while
      the static page shows, Compose would size its canvas to that, and the canvas would stay stretched after the
      scrollbar left at hand-off.
    */
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); }
    #static-scroll { position: fixed; inset: 0; overflow-y: auto; }
    body {
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #static-content { max-width: 1120px; margin: 0 auto; padding: 96px 20px 120px; }
    /* Under the bar the hero starts where the app's does (its topSpacing): 40px down on a phone, 96px from 600px up. */
    @media (max-width: 599px) { #static-content { padding-top: 40px; } }
    /*
      The bar over the page (StaticHtml.bar), as the app's TopBar: sticky inside #static-scroll, which is what
      scrolls. Flat at the very top; once the page moves, the hairline under it and the reading progress along it.
      --bar-offset is its whole height: a jump to an anchor stops 24px below it. A margin on the targets rather than
      scroll-padding on the scroller, which would count the bar's own controls as hidden under it and scroll the
      page each time the keyboard reached one.
    */
    :root { --bar-offset: 64px; }
    #static-content [id] { scroll-margin-top: calc(var(--bar-offset) + 24px); }
    @media (prefers-reduced-motion: no-preference) { #static-scroll { scroll-behavior: smooth; } }
    .bar { position: sticky; top: 0; z-index: 5; background: var(--bg); box-shadow: 0 1px 0 var(--line); }
    /* Where the page can show through, it does, blurred; elsewhere the bar is the page's own colour. */
    @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
      .bar {
        background: color-mix(in srgb, var(--bg) 84%, transparent);
        -webkit-backdrop-filter: saturate(1.5) blur(14px); backdrop-filter: saturate(1.5) blur(14px);
      }
    }
    .js .bar:not(.scrolled) { box-shadow: none; }
    .bar-row { display: flex; align-items: center; gap: 12px; max-width: 1120px; height: 64px; margin: 0 auto; padding: 0 20px; }
    /* The monogram, the way home: the initials on the accent, deepening towards the bottom right. */
    .mark {
      flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px;
      background: var(--accent); background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: var(--on-accent); font-size: 13px; font-weight: 600; letter-spacing: -.02em; line-height: 1; text-decoration: none;
      box-shadow: inset 0 1px 0 rgb(255 255 255 / .2), 0 1px 2px rgb(0 0 0 / .15);
    }
    /* The brand slot: the proof chip, and the name over the role, share one cell and cross-fade. */
    .brand { flex: 1 1 auto; min-width: 0; display: grid; align-items: center; }
    .brand > * { grid-area: 1 / 1; min-width: 0; transition: opacity .22s ease, transform .22s ease, visibility .22s; }
    /*
      The proof chip (StaticHtml.proofChip), as the app's: the notes' rating, a hairline divider and the visit count,
      on a breath of the accent over the page, ringed by a hairline. Hidden until the script has the numbers, then
      faded in. Where the bar is too narrow for all of it, the script drops its muted words (.bare), then four of the
      five stars (.one), then closes it up (.tight), measuring the chip as it is filled and as the bar resizes, so the
      cut follows the digits it actually has.
    */
    .bar .proof {
      justify-self: start; display: inline-flex; align-items: center; gap: 10px; max-width: 100%; height: 32px;
      padding: 0 12px 0 10px; overflow: hidden; white-space: nowrap; color: var(--ink); font-size: 13px; font-weight: 500;
      line-height: 1; text-decoration: none; font-variant-numeric: tabular-nums;
      border: 1px solid var(--line); border-radius: 999px;
      background: var(--surface); background: color-mix(in srgb, var(--accent) 7%, var(--bg));
      opacity: 0; transform: translateY(4px);
      transition: opacity .22s ease, transform .22s ease, visibility .22s, background-color .15s, border-color .15s;
    }
    .bar .proof[hidden], .bar .proof [hidden] { display: none; }
    .bar .proof.on { opacity: 1; transform: none; }
    .bar .proof:hover { background: color-mix(in srgb, var(--accent) 12%, var(--bg)); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
    .proof .rate, .proof .seen { display: inline-flex; align-items: center; gap: 5px; }
    /* The dashboard's meter, small: five stars, the accent drawn over them to the average's fraction. */
    .proof .meter { margin: 0; font-size: 13px; letter-spacing: .06em; }
    .proof b { font-weight: 700; letter-spacing: 0; }
    /* While the count runs, the total holds its final width (the script sets it), so the chip never grows. */
    .proof .visits { text-align: right; }
    .proof .words { color: var(--muted); }
    .proof .sep { flex: none; width: 1px; height: 14px; background: var(--line-strong); }
    .proof .eye { flex: none; color: var(--accent); }
    .proof.bare .words { display: none; }
    .proof.one .meter::before { content: "★"; color: var(--accent); }
    .proof.one .meter::after { content: none; }
    /* The last resort, on the narrowest phones: the same, closer together. */
    .bar .proof.tight { gap: 7px; padding: 0 9px 0 8px; }
    .proof.tight .rate, .proof.tight .seen { gap: 4px; }
    .who strong, .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* The whole role, or on a phone its whole-word short form, as the app's bar cuts it. */
    .who .short { display: none; }
    @media (max-width: 640px) {
      .who .full { display: none; }
      .who .short { display: inline; }
    }
    .who { display: flex; flex-direction: column; line-height: 1.25; opacity: 0; visibility: hidden; transform: translateY(6px); }
    .who strong { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
    .who span { color: var(--muted); font-size: 12px; }
    /* inherit rather than visible, so the bar hidden at hand-off hides what is in it too. */
    .bar.passed .proof { opacity: 0; visibility: hidden; transform: translateY(-6px); }
    .bar.passed .who { opacity: 1; visibility: inherit; transform: none; }
    .sections ul { position: relative; display: flex; gap: 2px; margin: 0; padding: 0; list-style: none; }
    .sections a {
      display: block; padding: 8px 10px; border-radius: 8px; color: var(--muted); font-size: 15px; font-weight: 500;
      line-height: 24px; text-decoration: none; white-space: nowrap; transition: color .15s, background-color .15s;
    }
    .sections a:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 5%, transparent); }
    .sections a[aria-current] { color: var(--accent); }
    /* The active link's 2px pill, sliding from link to link: the script sets --x and --w from the link's box. */
    .sections ul::after {
      content: ""; position: absolute; left: 0; bottom: 3px; width: calc(var(--w, 20px) - 20px); height: 2px; border-radius: 1px;
      background: var(--accent); opacity: 0; transform: translateX(calc(var(--x, 0px) + 10px)); pointer-events: none;
    }
    .sections ul.lit::after { opacity: 1; }
    .sections ul.glide::after { transition: transform .25s cubic-bezier(.33, 1, .68, 1), width .25s cubic-bezier(.33, 1, .68, 1), opacity .2s; }
    /* The theme switch, as the app's: a pill with the sun and the moon, the accent knob over whichever is on. */
    .theme {
      display: none; position: relative; flex: none; width: 60px; height: 32px; padding: 0; cursor: pointer;
      color: var(--muted); background: var(--line); border: 1px solid var(--line-strong); border-radius: 999px;
    }
    .js .theme { display: block; }
    .theme .knob { position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); transition: transform .22s cubic-bezier(.33, 1, .68, 1); }
    .theme svg { position: absolute; top: 7px; transition: color .22s; }
    .theme .sun { left: 7px; color: var(--on-accent); }
    .theme .moon { left: 35px; }
    :root[data-theme="dark"] .theme .knob { transform: translateX(28px); }
    :root[data-theme="dark"] .theme .sun { color: var(--muted); }
    :root[data-theme="dark"] .theme .moon { color: var(--on-accent); }
    .menu {
      display: none; flex: none; place-items: center; width: 40px; height: 40px; margin-right: -8px; padding: 0; cursor: pointer;
      color: var(--ink); background: transparent; border: 0; border-radius: 10px;
    }
    .menu:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
    .bar a:focus-visible, .bar button:focus-visible, .to-top:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    /*
      How far down the page the reader is, along the bar's bottom edge, over the hairline. CSS draws it straight
      from the scroll where it can; elsewhere the page's script sets --progress.
    */
    .progress {
      position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); pointer-events: none;
      transform-origin: 0 50%; transform: scaleX(var(--progress, 0));
    }
    @supports (animation-timeline: scroll()) {
      .progress { animation: progress linear both; animation-timeline: scroll(nearest block); }
    }
    @keyframes progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    /* Below the width the app shows its links at (plus room for the chip), the links leave the bar's row. */
    @media (max-width: 899px) {
      /* Without the script: a row of their own under the bar, scrolling sideways if they must, never the page. */
      :root:not(.js) { --bar-offset: 112px; }
      :root:not(.js) .bar-row { flex-wrap: wrap; height: auto; row-gap: 0; }
      :root:not(.js) .brand { height: 64px; }
      :root:not(.js) .sections { flex: 1 0 calc(100% + 40px); margin: 0 -20px; overflow-x: auto; scrollbar-width: none; }
      :root:not(.js) .sections::-webkit-scrollbar { display: none; }
      :root:not(.js) .sections ul { width: max-content; padding: 0 10px 8px; }
      /* With it, as the app's compact bar: the switch, then a menu that drops the links down under the bar. */
      .js .menu { display: grid; }
      .js .sections {
        position: absolute; top: calc(100% + 6px); right: 12px; min-width: 220px; padding: 6px;
        background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 40px rgb(0 0 0 / .16);
        opacity: 0; visibility: hidden; transform: translateY(-6px); transition: opacity .18s, transform .18s, visibility .18s;
      }
      /* Visible at once on opening, so the focus can move in; hidden only once it has faded on closing. */
      .js .bar.open .sections { opacity: 1; visibility: inherit; transform: none; transition: opacity .18s, transform .18s, visibility 0s; }
      .js .sections ul { flex-direction: column; }
      .js .sections ul::after { display: none; }
      .js .sections a { padding: 10px 14px; color: var(--ink); font-size: 16px; }
      .js .sections a[aria-current] { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
    }
    /* Back to top: a round button at the bottom end, shown by the script once the reader is 1.5 screens down. */
    .to-top {
      position: fixed; right: 20px; bottom: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 5;
      display: grid; place-items: center; width: 48px; height: 48px; padding: 0; cursor: pointer;
      color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 50%;
      box-shadow: 0 6px 20px rgb(0 0 0 / .12), 0 1px 3px rgb(0 0 0 / .08);
      opacity: 0; visibility: hidden; transform: scale(.85); transition: opacity .2s, transform .2s, visibility .2s;
    }
    .to-top.shown { opacity: 1; visibility: inherit; transform: none; }
    .to-top:hover { border-color: var(--accent); color: var(--accent); }
    /*
      The reading measure: running text stops at about 68 characters a line, as the app's ~680dp column, at the
      body's 1.6 line height. Kept to the lowest specificity, so the parts with a measure of their own keep it.
    */
    p, li, dd { max-width: 68ch; text-wrap: pretty; }
    h1, h2, h3, h4 { text-wrap: balance; }
    article > ul:not([class]) > li + li { margin-top: .4em; }
    /*
      The hero's portrait, as the app's still picture: the cut-out stands at the end of a tinted stage, head clear of
      its top, shouting toward the start. Three sound lines leave the face, and seven echoes of the silhouette (the
      image as a mask, filled with the accent) trail away, each wider and fainter than the last, the far ones melted
      by the SVG filters. The app also makes it scream; here it stays still. Clipped at the bottom corners only, so
      the head rises above the stage. Beside the intro from 840px, as the app's wide layout. --step is 0.095 of the
      figure's width; --s scales the sound lines, drawn for the 224px portrait.
    */
    .portrait { position: relative; height: 168px; max-width: 480px; margin: 0 0 20px; overflow: hidden; border-radius: 0 0 24px 24px; --step: 13px; --s: .75; }
    .portrait::before { content: ""; position: absolute; inset: 26% 0 0; border-radius: 24px; background: linear-gradient(var(--stage), color-mix(in srgb, var(--stage) 40%, var(--bg))); }
    .portrait .melt { position: absolute; }
    .portrait .echo { position: absolute; inset: 0 calc(20px + var(--k) * var(--step)) 0 0; transform: scaleX(calc(1 + var(--k) * .05)); transform-origin: right; }
    .portrait .echo i {
      position: absolute; inset: 0; background: var(--accent);
      -webkit-mask: var(--photo) right bottom / auto 100% no-repeat; mask: var(--photo) right bottom / auto 100% no-repeat;
    }
    .portrait .echo:nth-of-type(1) { --k: 7; opacity: .05; filter: url(#melt-3); }
    .portrait .echo:nth-of-type(2) { --k: 6; opacity: .1; filter: url(#melt-3); }
    .portrait .echo:nth-of-type(3) { --k: 5; opacity: .17; filter: url(#melt-2); }
    .portrait .echo:nth-of-type(4) { --k: 4; opacity: .25; filter: url(#melt-2); }
    .portrait .echo:nth-of-type(5) { --k: 3; opacity: .34; filter: url(#melt-1); }
    .portrait .echo:nth-of-type(6) { --k: 2; opacity: .44; }
    .portrait .echo:nth-of-type(7) { --k: 1; opacity: .55; }
    .portrait .person { position: absolute; right: 20px; bottom: 0; height: 100%; }
    .portrait .person img { display: block; height: 100%; width: auto; position: relative; }
    .portrait .shout { position: absolute; left: 46%; top: 30%; overflow: visible; transform: scale(var(--s)); transform-origin: 0 0; }
    .portrait .shout path { fill: none; stroke: var(--shout); stroke-linecap: round; }
    @media (min-width: 600px) { .portrait { height: 208px; --step: 17px; --s: .93; } }
    @media (min-width: 840px) {
      .hero .portrait { float: right; width: 380px; height: 224px; margin: 0 0 24px 48px; --step: 18px; --s: 1; }
      .hero .proof { clear: both; }
    }
    .hero h1 { font-size: clamp(44px, 9vw, 72px); line-height: 1.05; letter-spacing: -0.03em; margin: 8px 0 16px; }
    .headline { font-size: clamp(20px, 3vw, 24px); margin: 0 0 12px; max-width: 720px; }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; margin: 0; }
    .hero .proof { list-style: none; padding: 0; margin: 24px 0 8px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); max-width: 960px; }
    .hero .proof strong { display: block; color: var(--accent); font-size: 28px; line-height: 1.2; }
    .hero .proof li { color: var(--muted); font-size: 15px; line-height: 1.5; }
    .muted { color: var(--muted); }
    section { margin-top: 96px; }
    h2 { font-size: 28px; letter-spacing: -0.01em; margin: 0 0 24px; }
    h3 { font-size: 19px; margin: 0 0 4px; }
    .cards { list-style: none; padding: 0; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .cards li, article { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
    article + article { margin-top: 16px; }
    a { color: var(--accent); font-weight: 600; }
    .shots { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
    /* Never wider than the page: a wide shot on a phone is cropped to fit rather than pushing the page sideways. */
    .shots img { display: block; height: 200px; width: auto; max-width: 100%; object-fit: cover; border: 1px solid var(--line); border-radius: 10px; background: var(--line); }
    .shots picture { display: block; }
    img.cover { display: block; margin: 0 auto 16px; border: 1px solid var(--line); background: var(--line); }
    img.cover.landscape { width: 100%; height: auto; border-radius: 12px; }
    img.cover.portrait { height: 320px; width: auto; border: 5px solid var(--line-strong); border-radius: 26px; }
    .note { color: var(--muted); max-width: 640px; margin: -8px 0 24px; }
    .badge { display: inline-block; font-size: 13px; font-weight: 600; line-height: 1.4; padding: 1px 8px; border: 1px solid var(--line-strong); border-radius: 6px; color: var(--muted); white-space: nowrap; }
    .links a { display: inline-block; margin: 0 16px 8px 0; padding: 12px 0; }
    .tagline { font-size: 19px; line-height: 1.45; margin: 8px 0 4px; }
    .disclaimer { color: var(--muted); font-size: 15px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 14px; }
    /* The message form and the note form (and the bar's proof chip): only rendered when portfolio.json names an "api". */
    form.feedback, form.message { display: grid; gap: 14px; max-width: 640px; margin-top: 12px; }
    form.feedback .fields, form.message .fields { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    form.feedback label, form.message label { display: grid; gap: 6px; font-size: 15px; font-weight: 600; }
    form.feedback label .muted, form.message label .muted { font-weight: 400; }
    form.feedback input, form.feedback select, form.feedback textarea, form.message input, form.message textarea {
      font: inherit; font-weight: 400; color: var(--ink); background: var(--surface);
      border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 12px;
    }
    form.feedback textarea, form.message textarea { resize: vertical; min-height: 120px; }
    form.feedback button, form.message button {
      justify-self: start; font: inherit; font-weight: 600; color: var(--on-accent); background: var(--accent);
      border: 0; border-radius: 10px; padding: 12px 20px; cursor: pointer;
    }
    form.feedback button:disabled, form.message button:disabled { opacity: .6; cursor: default; }
    form.feedback .trap, form.message .trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    form.message label.topic, form.feedback label.relation { display: flex; align-items: center; gap: 10px; font-weight: 400; }
    form.message label.topic input, form.feedback label.relation input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
    form.feedback .status, form.message .status { margin: 0; min-height: 1.6em; color: var(--muted); }
    form.message fieldset, form.feedback fieldset { display: flex; flex-wrap: wrap; gap: 8px 20px; border: 0; margin: 0; padding: 0; }
    form.message legend, form.feedback legend { padding: 0; margin: 0 0 6px; font-size: 15px; font-weight: 600; }
    form.message legend .muted, form.feedback legend .muted { font-weight: 400; }
    h3 .badge { vertical-align: middle; }
    .visitor-notes { margin: 40px 0 40px; }
    /* The rules below give these a display, which would beat the hidden attribute's; hidden must still hide them. */
    .visitor-notes [hidden] { display: none !important; }
    /* The ratings dashboard: the average with its stars lit to the fraction, and a bar per number of stars, each opening its sheet. */
    .ratings {
      display: grid; grid-template-columns: minmax(180px, 36fr) 64fr; gap: 24px; align-items: center; margin: 16px 0 12px; padding: 32px;
      border: 1px solid var(--line); border-radius: 20px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 7%, transparent), transparent 70%), var(--surface);
    }
    .ratings .average { text-align: center; }
    .ratings p { margin: 0; }
    .ratings .score strong { font-size: 52px; line-height: 1.1; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .ratings .score span { color: var(--muted); font-size: 18px; margin-left: 4px; }

<body>
  <div class="loading-bar" aria-hidden="true"></div>
  <div id="static-scroll">
{{bar}}
    <main id="static-content">
{{content}}
    </main>
{{toTop}}
  </div>
  <div id="app" aria-hidden="true"></div>
  <script>
    // A deep link into the app (#/projects/<id>) lands on that project's article here too, before the app (or
    // without it, on browsers that cannot run it). On arrival it is simply there; a later change of the address
    // glides to it like any other jump.
    (function () {
      function reveal(arriving) {
        var match = /^#\/projects\/([a-z0-9][a-z0-9-]*)\/?$/.exec(location.hash);
        var article = match && document.getElementById("project-" + match[1]);
        if (!article || document.body.classList.contains("app-ready")) return;
        var scroller = document.getElementById("static-scroll");
        if (arriving) scroller.style.scrollBehavior = "auto";
        article.scrollIntoView();
        scroller.style.scrollBehavior = "";
      }
      reveal(true);
      window.addEventListener("hashchange", function () { reveal(false); });
    })();
  </script>
  <script>
    // The bar (StaticHtml.bar) and the back-to-top button. All of it adds to what already works without it: the
    // links and the monogram are plain anchors, which the CSS scrolls smoothly unless motion is reduced.
    (function () {
      var scroller = document.getElementById("static-scroll");
      var bar = document.querySelector("header.bar");
      if (!scroller || !bar) return;
      var root = document.documentElement;
      var nav = bar.querySelector(".sections"), list = nav.querySelector("ul"), menu = bar.querySelector(".menu");
      var links = Array.prototype.slice.call(nav.querySelectorAll("a"));
      var sections = links.map(function (link) { return document.getElementById(link.hash.slice(1)); });
      var mark = bar.querySelector(".mark"), toTop = document.querySelector(".to-top");
      function media(query) { return window.matchMedia ? window.matchMedia(query) : { matches: false }; }
      function onChange(query, listener) {
        if (query.addEventListener) query.addEventListener("change", listener); else if (query.addListener) query.addListener(listener);
      }

      // The switch: the same "theme" key the app's switch writes, applied through the head's applyTheme.
      var theme = bar.querySelector(".theme");
      function dark() { return root.getAttribute("data-theme") === "dark"; }
      function showTheme() { theme.setAttribute("aria-checked", String(dark())); }
      theme.addEventListener("click", function () {
        var next = dark() ? "light" : "dark";
        try { localStorage.setItem("theme", next); } catch (e) {}
        window.applyTheme(next);
        showTheme();
      });
      showTheme();

      // The section being read: the last whose top has passed the reading line, a little under where a jump puts
      // its heading; at the very end, the last one, however short. Its link is marked, and on a wide bar the
      // accent pill slides under it.
      var active = null, atEnd = false;
      function readingLine() { return bar.getBoundingClientRect().bottom + 32; }
      function pick() {
        var line = readingLine(), index = -1;
        sections.forEach(function (section, i) { if (section && section.getBoundingClientRect().top <= line) index = i; });
        if (atEnd) index = sections.length - 1;
        var link = index < 0 ? null : links[index];
        if (link === active) return;
        if (active) active.removeAttribute("aria-current");
        active = link;
        if (link) link.setAttribute("aria-current", "true");
        place();
      }
      function place() {
        list.classList.toggle("lit", !!active);
        if (!active) return;
        list.style.setProperty("--x", active.offsetLeft + "px");
        list.style.setProperty("--w", active.offsetWidth + "px");
      }

      // Narrow screens: the links live in a menu under its button, as in the app. Opening it puts the focus on the
      // section being read; it closes on a pick, on Esc (the focus back on the button), on a press or the focus
      // anywhere else, and once the screen is wide enough for the links to sit in the bar.
      var wide = media("(min-width: 900px)");
      function isOpen() { return bar.classList.contains("open"); }
      function setOpen(open) {
        bar.classList.toggle("open", open);
        menu.setAttribute("aria-expanded", String(open));
      }
      menu.addEventListener("click", function () {
        setOpen(!isOpen());
        if (isOpen()) (active || links[0]).focus();
      });
      links.forEach(function (link) { link.addEventListener("click", function () { if (isOpen()) setOpen(false); }); });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && isOpen()) { setOpen(false); menu.focus(); }
      });
      document.addEventListener(window.PointerEvent ? "pointerdown" : "mousedown", function (event) {
        if (isOpen() && !bar.contains(event.target)) setOpen(false);
      });
      bar.addEventListener("focusout", function (event) {
        if (isOpen() && event.relatedTarget && !bar.contains(event.relatedTarget)) setOpen(false);
      });
      onChange(wide, function () { if (wide.matches) setOpen(false); place(); });

      // Back to top: the focus goes to the bar's own way home first, so a keyboard reader carries on from the top;
      // the scroll is the CSS's, smooth unless motion is reduced.
      if (toTop) toTop.addEventListener("click", function () {
        try { mark.focus({ preventScroll: true }); } catch (e) { mark.focus(); }
        if (scroller.scrollTo) scroller.scrollTo({ top: 0 }); else scroller.scrollTop = 0;
      });

      // The reading keys. The page itself never scrolls, #static-scroll does, and until something in it has been
      // clicked or focused the browser sends the keys to the page, where they do nothing. With nothing focused they
      // move #static-scroll instead, as the app reads them: about 85% of a screen, 72px for an arrow, the ends for
      // Home and End, smoothly unless motion is reduced. Whatever has the focus keeps its own keys.
      var STEPS = { PageDown: 0.85, PageUp: -0.85, " ": 0.85, ArrowDown: 72, ArrowUp: -72 };
      document.addEventListener("keydown", function (event) {
        var focus = document.activeElement;
        if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;
        if ((focus && focus !== document.body && focus !== root) || document.body.classList.contains("app-ready")) return;
        var step = STEPS[event.key], view = scroller.clientHeight;
        if (event.key === "Home") step = -scroller.scrollTop;
        else if (event.key === "End") step = scroller.scrollHeight;
        else if (step === undefined) return;
        else if (Math.abs(step) < 1) step = step * view * (event.key === " " && event.shiftKey ? -1 : 1);
        event.preventDefault();
        if (scroller.scrollBy) scroller.scrollBy({ top: step }); else scroller.scrollTop += step;
      });

      // The keyboard moving up the page can land the focus under the bar, which the browser counts as on screen:
      // once it has had its own say, the page is nudged down just enough to show it. Not the bar's own controls,
      // nor the star sheet's, which floats above it all.
      scroller.addEventListener("focusin", function (event) {
        var target = event.target;
        if (bar.contains(target) || (target.closest && target.closest("dialog"))) return;
        requestAnimationFrame(function () {
          var hidden = bar.getBoundingClientRect().bottom + 8 - target.getBoundingClientRect().top;
          if (hidden > 0 && document.activeElement === target) scroller.scrollTop -= hidden;
        });
      });

      // On scroll, at most once a frame: the hairline, the button, the progress where CSS cannot draw it from the
      // scroll itself, and the end of the page, where the last section takes its turn.
      var cssProgress = !!(window.CSS && CSS.supports && CSS.supports("animation-timeline: scroll()"));
      var queued = false;
      function update() {
        queued = false;
        var top = scroller.scrollTop, view = scroller.clientHeight, room = scroller.scrollHeight - view;
        bar.classList.toggle("scrolled", top > 0);
        if (toTop) toTop.classList.toggle("shown", top > view * 1.5);
        if (!cssProgress) bar.style.setProperty("--progress", room > 0 ? Math.min(1, top / room).toFixed(4) : "0");
        var end = room > 0 && top >= room - 2;
        if (end !== atEnd) { atEnd = end; pick(); }
      }
      scroller.addEventListener("scroll", function () {
        if (!queued) { queued = true; requestAnimationFrame(update); }
      }, { passive: true });

      // Two observers, so nothing is measured on every frame: the hero's name going up under the bar swaps the
      // brand slot to the name over the role; a section's edge crossing the reading line (a band one pixel tall)
      // has the active link picked again. Both depend on the bar's height and the screen's, so a resize sets
      // them up anew.
      var watchers = [];
      function watch() {
        watchers.forEach(function (watcher) { watcher.disconnect(); });
        watchers = [];
        if (!window.IntersectionObserver) return pick();
        var under = Math.round(bar.getBoundingClientRect().bottom), line = Math.round(readingLine());
        var name = document.querySelector("#static-content .hero h1");
        if (name) {
          var hero = new IntersectionObserver(function (entries) {
            var entry = entries[entries.length - 1];
            bar.classList.toggle("passed", !entry.isIntersecting && entry.boundingClientRect.top < entry.rootBounds.top);
          }, { root: scroller, rootMargin: -under + "px 0px 0px 0px" });
          hero.observe(name);
          watchers.push(hero);
        }
        var below = Math.max(0, scroller.clientHeight - line - 1);
        var reading = new IntersectionObserver(pick, { root: scroller, rootMargin: -line + "px 0px " + -below + "px 0px" });
        sections.forEach(function (section) { if (section) reading.observe(section); });
        watchers.push(reading);
      }
      var resizing = false;
      window.addEventListener("resize", function () {
        if (resizing) return;
        resizing = true;
        requestAnimationFrame(function () { resizing = false; watch(); place(); update(); });
      });
      watch();
      update();
      // The pill only slides once it has found its first link, never in from the left edge on arrival.
      requestAnimationFrame(function () { requestAnimationFrame(function () { list.classList.add("glide"); }); });

      // Once the app has drawn over the page, nothing here has anything left to do.
      if (window.MutationObserver) {
        new MutationObserver(function (records, observer) {
          if (!document.body.classList.contains("app-ready")) return;
          observer.disconnect();
          watchers.forEach(function (watcher) { watcher.disconnect(); });
          setOpen(false);
        }).observe(document.body, { attributes: true, attributeFilter: ["class"] });
      }
    })();
  </script>
  <script>
    // The bar's proof chip, the notes and the note form talk to the site's own backend (worker/), named
    // by portfolio.json's "api" as data-api on their elements. Without one, none of them is on the page and nothing
    // here runs. The backend counts a visitor once a day, so the app counting the same page load again changes nothing.
    (function () {
      // The notes: the dashboard's numbers, a page of notes at a time (pinned first, then newest, as the backend
      // orders them), and a star's sheet, which a bar opens. The same words as the app (FeedbackCopy, Relation).
      var notesBox = document.querySelector(".visitor-notes[data-api]");
      var listed = { offset: 0, loading: false, seq: 0 };
      var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      // Relation: the wire value, the label (a card's badge; Other never gets one) and the plural (a sorter chip).
      var RELATIONS = [
        ["colleague", "Colleague", "Colleagues"],
        ["friend", "Friend", "Friends"],
        ["special", "Special someone", "Special someone"],
        ["other", "Other", "Others"],
      ];
      // FeedbackCopy.noneInSheet's words for each relation.
      var FROM = { colleague: " from colleagues", friend: " from friends", special: " from a special someone", other: " from others" };

          .then(function (r) { return r.ok ? r.json() : null; })

      var picked = { stars: 0, relation: "", offset: 0, seq: 0, opener: null };
      function inSheet(selector) { return sheet.querySelector(selector); }
      function eachChip(action) { Array.prototype.forEach.call(sheet.querySelectorAll(".relations button"), action); }
      function fillSheet(data, append, focused) {

        RELATIONS.forEach(function (r) { readable += counts[r[0]] || 0; });

        inSheet(".summary").textContent = plural(rated, "rating", "ratings") + " · " + plural(readable, "note", "notes") + " to read";
        eachChip(function (chip) {

        more.hidden = !data.more;
        more.disabled = false;

        if (focused) refocus(more, first);
        var empty = inSheet(".empty");
        empty.textContent = "No notes" + (FROM[relation] || "") + " with " + plural(stars, "star", "stars") + " yet.";
        empty.hidden = list.children.length > 0;
        // FeedbackCopy.privateInSheet, on All only: the private words belong to no relation.
        var kept = (ratings.privateStars && ratings.privateStars[stars]) || 0;
        var line = inSheet(".private-line");
        line.textContent = "+" + kept + " private " + stars + "-star " + (kept === 1 ? "rating" : "ratings") +

      }
      function loadSheet(append) {
        var seq = ++picked.seq;
        var query = ["stars=" + picked.stars];
        if (picked.relation) query.push("relation=" + picked.relation);
        if (append) query.push("offset=" + picked.offset);

          .then(function (data) {

      });
    })();
  </script>
  <script>
    // The LinkedIn and GitHub links (data-track) count their clicks, middle clicks included: a beacon, which the browser
    // delivers even as the link takes the tab away, at most once per link per page load; the backend counts a visitor
    // once a day per link anyway. The private message form posts like the note form. Both only exist with an "api".
    (function () {
      var tracked = {};
      function track(event) {
        if (event.type === "auxclick" && event.button !== 1) return;
        var link = event.currentTarget, name = link.dataset.track;
        if (tracked[name] || !navigator.sendBeacon) return;
        tracked[name] = true;
        try { navigator.sendBeacon(link.dataset.api + "/clicks", JSON.stringify({ link: name })); } catch (e) {}
      }
      Array.prototype.forEach.call(document.querySelectorAll("a[data-track][data-api]"), function (link) {
        link.addEventListener("click", track);
        link.addEventListener("auxclick", track);
      });
      var form = document.querySelector("form.message[data-api]");
      if (!form) return;
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var status = form.querySelector(".status");
        var button = form.querySelector("button");
        var message = {};
        new FormData(form).forEach(function (value, key) { message[key] = value; });
        button.disabled = true;
        status.textContent = "Sending…";
        fetch(form.dataset.api + "/messages", {
          method: "POST", credentials: "omit", headers: { "Content-Type": "application/json" }, body: JSON.stringify(message),
        })
          .then(function (r) { return r.json().then(function (body) { return { ok: r.ok, body: body }; }); })
          .then(function (r) {
            if (r.ok) { form.reset(); status.textContent = "Thanks, your message is in. I'll reply to the contact you left."; }
            else { status.textContent = (r.body && r.body.error) || "The message could not be sent. Try again, or email me."; }
          })
          .catch(function () { status.textContent = "The message could not be sent. Check the connection and try again."; })
          .then(function () { button.disabled = false; });
      });
    })();
  </script>
  <script>
    (function () {
      // A minimal module declaring a GC struct type: validates only where WasmGC (required by Kotlin/Wasm) exists.
      var gc = typeof WebAssembly === "object" &&
        WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]));
      function staticOnly() { document.body.classList.add("static-only"); }
      if (!gc) return staticOnly();
      var started = false;
      function start() {
        if (started) return;
        started = true;
        var script = document.createElement("script");
        // The build id in the query gives each deploy's script its own URL. GitHub Pages caches every file for ten
        // minutes, so an unversioned composeApp.js could be the previous deploy's, pointing at wasm files that are
        // gone (those are content-hashed already); this one is always the script this index.html was built with.
        script.src = "composeApp.js?v={{build}}";
        script.onerror = staticOnly;
        document.body.appendChild(script);
      }
      // Start the multi-megabyte app only after the static page's first contentful paint, so it never competes
      // with that paint for bandwidth; Lighthouse's simulated LCP otherwise waited on the whole Wasm download.
      // The timeout covers browsers that never report the paint (e.g. a tab opened in the background).
      try {
        new PerformanceObserver(function (list, observer) {
          if (list.getEntriesByName("first-contentful-paint").length) {
            observer.disconnect();
            setTimeout(start, 0);
          }
        }).observe({ type: "paint", buffered: true });
      } catch (e) {
        start();
      }
      setTimeout(start, 3000);
    })();
  </script>
