<!doctype html>
<!--
  Template for the generateStaticSite Gradle task. The double-brace placeholders are filled from portfolio.json, except
  {{build}}, the id of the build (the git commit); do not edit the generated build/generated/site/index.html.

  Boot: the static <main> is a full, crawlable version of the page and shows first. If the browser supports
  WasmGC, composeApp.js loads the Compose app into #app (invisible), and once it has drawn real content Kotlin
  adds body.app-ready, which fades the app in over it. Without WasmGC, or if the script fails, the static page
  simply stays.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{url}}">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FAFAFA">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:site_name" content="{{name}}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script type="application/ld+json">{{jsonLd}}</script>
  <script>
    // The page is light unless the visitor switched to dark: the "theme" key in localStorage, "light" or "dark",
    // which the app's switch writes too. It is applied here, before the first paint, so a saved theme never flashes
    // the other one; the app calls applyTheme again on a switch, so the page under its canvas and the browser's own
    // chrome follow. The colours match ui/theme/Theme.kt.
    window.applyTheme = function (theme) {
      var dark = theme === "dark";
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", dark ? "#0C0E13" : "#FAFAFA");
    };
    try { window.applyTheme(localStorage.getItem("theme")); } catch (e) { window.applyTheme("light"); }
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #FAFAFA; --surface: #FFFFFF; --ink: #09090B; --muted: #475569; --line: #E4E4E7; --line-strong: #D4D4D8;
      --accent: #2563EB; --on-accent: #FFFFFF;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0C0E13; --surface: #15181F; --ink: #F4F4F5; --muted: #A1A1AA; --line: #27272A; --line-strong: #3F3F46;
      --accent: #60A5FA; --on-accent: #0B1D3F;
    }
    * { box-sizing: border-box; }
    /*
      The page itself never scrolls: #static-scroll does. A body scrollbar would make the viewport narrower while
      the static page shows, Compose would size its canvas to that, and the canvas would stay stretched after the
      scrollbar left at hand-off.
    */
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); }
    #static-scroll { position: fixed; inset: 0; overflow-y: auto; }
    body {
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #static-content { max-width: 1120px; margin: 0 auto; padding: 96px 20px 120px; }
    .hero h1 { font-size: clamp(44px, 9vw, 72px); line-height: 1.05; letter-spacing: -0.03em; margin: 8px 0 16px; }
    .headline { font-size: clamp(20px, 3vw, 24px); margin: 0 0 12px; max-width: 720px; }
    .live-stats { font-size: 15px; font-weight: 600; margin: 0 0 16px; }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; margin: 0; }
    .proof { list-style: none; padding: 0; margin: 24px 0 8px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); max-width: 960px; }
    .proof strong { display: block; color: var(--accent); font-size: 28px; line-height: 1.2; }
    .proof li { color: var(--muted); font-size: 15px; line-height: 1.5; }
    .muted { color: var(--muted); }
    section { margin-top: 96px; }
    h2 { font-size: 28px; letter-spacing: -0.01em; margin: 0 0 24px; }
    h3 { font-size: 19px; margin: 0 0 4px; }
    .cards { list-style: none; padding: 0; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .cards li, article { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
    article + article { margin-top: 16px; }
    a { color: var(--accent); font-weight: 600; }
    .shots { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
    .shots img { display: block; height: 200px; width: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--line); }
    .shots picture { display: block; }
    img.cover { display: block; margin: 0 auto 16px; border: 1px solid var(--line); background: var(--line); }
    img.cover.landscape { width: 100%; height: auto; border-radius: 12px; }
    img.cover.portrait { height: 320px; width: auto; border: 5px solid var(--line-strong); border-radius: 26px; }
    .note { color: var(--muted); max-width: 640px; margin: -8px 0 24px; }
    .badge { display: inline-block; font-size: 13px; font-weight: 600; line-height: 1.4; padding: 1px 8px; border: 1px solid var(--line-strong); border-radius: 6px; color: var(--muted); white-space: nowrap; }
    .links a { display: inline-block; margin: 0 16px 8px 0; padding: 12px 0; }
    article { scroll-margin-top: 24px; }
    .tagline { font-size: 19px; line-height: 1.45; margin: 8px 0 4px; }
    .disclaimer { color: var(--muted); font-size: 15px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 14px; }
    /* The message form, the note form and the hero's live line: only rendered when portfolio.json names an "api". */
    form.feedback, form.message { display: grid; gap: 14px; max-width: 640px; margin-top: 12px; }
    form.feedback .fields, form.message .fields { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    form.feedback label, form.message label { display: grid; gap: 6px; font-size: 15px; font-weight: 600; }
    form.feedback label .muted, form.message label .muted { font-weight: 400; }
    form.feedback input, form.feedback select, form.feedback textarea, form.message input, form.message textarea {
      font: inherit; font-weight: 400; color: var(--ink); background: var(--surface);
      border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 12px;
    }
    form.feedback textarea, form.message textarea { resize: vertical; min-height: 120px; }
    form.feedback button, form.message button {
      justify-self: start; font: inherit; font-weight: 600; color: var(--on-accent); background: var(--accent);
      border: 0; border-radius: 10px; padding: 12px 20px; cursor: pointer;
    }
    form.feedback button:disabled, form.message button:disabled { opacity: .6; cursor: default; }
    form.feedback .trap, form.message .trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    form.message label.topic { display: flex; align-items: center; gap: 10px; font-weight: 400; }
    form.message label.topic input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
    form.feedback .status, form.message .status { margin: 0; min-height: 1.6em; color: var(--muted); }
    form.message fieldset { display: flex; flex-wrap: wrap; gap: 8px 20px; border: 0; margin: 0; padding: 0; }
    form.message legend { padding: 0; margin: 0 0 6px; font-size: 15px; font-weight: 600; }
    form.message legend .muted { font-weight: 400; }
    h3 .badge { vertical-align: middle; }
    .visitor-notes { margin: 40px 0 8px; }
    /* The ratings dashboard: the average with its stars lit to the fraction, and a bar per number of stars, each a filter. */
    .ratings {
      display: grid; grid-template-columns: minmax(180px, 36fr) 64fr; gap: 24px; align-items: center; margin: 16px 0 12px; padding: 32px;
      border: 1px solid var(--line); border-radius: 20px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 7%, transparent), transparent 70%), var(--surface);
    }
    .ratings .average { text-align: center; }
    .ratings p { margin: 0; }
    .ratings .score strong { font-size: 52px; line-height: 1.1; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .ratings .score span { color: var(--muted); font-size: 18px; margin-left: 4px; }
    .meter { display: inline-block; position: relative; margin: 8px 0; font-size: 22px; line-height: 1; letter-spacing: .1em; color: var(--line-strong); }
    .meter::before { content: "★★★★★"; }
    .meter::after { content: "★★★★★"; position: absolute; top: 0; left: 0; width: var(--fill, 0%); overflow: hidden; white-space: nowrap; color: var(--accent); }
    .ratings .count { color: var(--muted); }
    .bars { list-style: none; margin: 0; padding: 0 0 0 24px; border-left: 1px solid var(--line); display: grid; gap: 2px; }
    .bars button {
      width: 100%; display: grid; grid-template-columns: 30px 1fr 36px 40px; gap: 12px; align-items: center; padding: 9px 12px;
      font: inherit; color: var(--ink); text-align: left; background: transparent; border: 0; border-radius: 12px; cursor: pointer;
      transition: background-color .15s, opacity .2s;
    }
    .bars button:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
    .bars button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .bars button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
    .bars.filtering button[aria-pressed="false"] { opacity: .45; }
    .bars .label { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bars .label i { font-style: normal; font-size: 12px; color: var(--accent); }
    .bars .track { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
    .bars .fill {
      display: block; height: 100%; width: 0; border-radius: 5px; transition: width .7s cubic-bezier(.4, 0, .2, 1);
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 72%, transparent), var(--accent));
    }
    .bars li:nth-child(2) .fill { transition-delay: 70ms; }
    .bars li:nth-child(3) .fill { transition-delay: 140ms; }
    .bars li:nth-child(4) .fill { transition-delay: 210ms; }
    .bars li:nth-child(5) .fill { transition-delay: 280ms; }
    .bars .n { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
    .bars .pct { text-align: right; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
    .kept-private { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
    .list-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; color: var(--muted); margin: 0; min-height: 1.6em; }
    .list-line button, .visitor-notes .more {
      font: inherit; font-weight: 600; color: var(--accent); background: transparent; border: 0; padding: 8px 4px; cursor: pointer;
    }
    .visitor-notes .more { display: block; margin: 20px auto 0; padding: 10px 20px; border: 1px solid var(--line-strong); border-radius: 10px; }
    .visitor-notes .more:disabled { opacity: .6; cursor: default; }
    @media (max-width: 640px) {
      .ratings { grid-template-columns: 1fr; gap: 20px; padding: 20px; }
      .ratings .average { text-align: left; }
      .bars { padding: 20px 0 0; border-left: 0; border-top: 1px solid var(--line); }
    }
    @media (prefers-reduced-motion: reduce) { .bars .fill, .bars button { transition: none; } }
    .notes { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .notes li { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
    .notes li p { margin: 0; }
    .notes .stars { color: var(--accent); letter-spacing: .08em; margin: 0 0 8px; }
    .notes .by { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
    /* Projects' two groups: an accent label ruled to the edge, as in the app. */
    .project-group + .project-group { margin-top: 64px; }
    h3.group { display: flex; align-items: center; gap: 12px; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
    h3.group::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
    .project-group > .note { margin: 0 0 24px; }
    article h4 { font-size: 19px; margin: 0 0 4px; }
    .heading { display: flex; align-items: center; gap: 12px; margin: 0 0 4px; }
    .heading h4 { margin: 0; }
    img.app-icon { flex: none; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 22%; background: var(--line); }
    article h5, .engineering h6 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 20px 0 8px; }
    .figures { list-style: none; margin: 16px 0; padding: 14px 16px; display: grid; gap: 8px; background: var(--bg); border-radius: 12px; }
    .figures li { display: grid; grid-template-columns: 6.5em 1fr; gap: 12px; align-items: baseline; font-size: 15px; }
    .figures strong { color: var(--accent); font-size: 22px; line-height: 1.2; white-space: nowrap; }
    .facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 12px 0; font-size: 15px; }
    .facts dt { color: var(--muted); font-weight: 600; }
    .facts dd { margin: 0; }
    .engineering { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 16px; }
    .engineering h5 { font-size: 17px; letter-spacing: normal; text-transform: none; color: var(--ink); margin: 0 0 8px; }
    .engineering code { font: 600 14px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--accent); }
    .modules, .modules ul { margin: 0; padding-left: 20px; }
    .modules ul { color: var(--muted); font-size: 15px; }
    .decisions dt { font-weight: 600; margin-top: 10px; }
    .decisions dd { margin: 2px 0 0; color: var(--muted); }
    .quality { padding-left: 20px; }
    #app { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
    .loading-bar {
      position: fixed; top: 0; left: 0; height: 3px; width: 40%; background: var(--accent);
      animation: loading 1.4s ease-in-out infinite;
    }
    @keyframes loading { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .loading-bar { animation: none; width: 100%; opacity: .5; } }
    body.app-ready #app { opacity: 1; pointer-events: auto; }
    /*
      After hand-off the static page stays rendered, covered by the opaque canvas, rather than display:none: its
      text is the page's LCP, a <canvas> can never be one, and with the page hidden CI's Lighthouse reported NO_LCP.
      markAppReady() makes it inert and aria-hidden so only the app is reachable.
    */
    body.app-ready #static-scroll { pointer-events: none; }
    body.app-ready .loading-bar, body.static-only #app, body.static-only .loading-bar { display: none; }
  </style>
</head>
<body>
  <div class="loading-bar" aria-hidden="true"></div>
  <div id="static-scroll">
    <main id="static-content">
{{content}}
    </main>
  </div>
  <div id="app" aria-hidden="true"></div>
  <script>
    // A deep link into the app (#/projects/<id>) lands on that project's article here too, before the app (or
    // without it, on browsers that cannot run it).
    (function () {
      function reveal() {
        var match = /^#\/projects\/([a-z0-9][a-z0-9-]*)\/?$/.exec(location.hash);
        var article = match && document.getElementById("project-" + match[1]);
        if (article && !document.body.classList.contains("app-ready")) article.scrollIntoView();
      }
      reveal();
      window.addEventListener("hashchange", reveal);
    })();
  </script>
  <script>
    // The hero's live line, the notes and the note form talk to the site's own backend (worker/), named
    // by portfolio.json's "api" as data-api on their elements. Without one, none of them is on the page and nothing
    // here runs. The backend counts a visitor once a day, so the app counting the same page load again changes nothing.
    (function () {
      function monthYear(day) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(day || "")) return "";
        return new Date(day + "T00:00:00Z").toLocaleDateString("en", { month: "short", year: "numeric", timeZone: "UTC" });
      }
      // The notes: the dashboard's numbers, a page of notes at a time, one star's or all, newest first. The same
      // words as the app (FeedbackCopy).
      var notesBox = document.querySelector(".visitor-notes[data-api]");
      var browsing = { stars: null, last: null, loading: false };
      function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }
      function noteItem(note) {
        var item = document.createElement("li");
        if (note.rating) {
          var stars = document.createElement("p");
          stars.className = "stars";
          stars.setAttribute("role", "img");
          stars.setAttribute("aria-label", note.rating + " of 5 stars");
          stars.textContent = "★".repeat(note.rating) + "☆".repeat(5 - note.rating);
          item.appendChild(stars);
        }
        var words = document.createElement("p");
        words.textContent = note.message;
        item.appendChild(words);
        var by = document.createElement("p");
        by.className = "by";
        var when = monthYear(note.date);
        by.textContent = (note.name || "A visitor") + (when ? " · " + when : "");
        item.appendChild(by);
        return item;
      }
      function showRatings(r) {
        var board = notesBox.querySelector(".ratings");
        if (!r || !r.count || r.average == null) { board.hidden = true; return; }
        var average = Number(r.average).toFixed(1);
        board.querySelector(".score strong").textContent = average;
        var meter = board.querySelector(".meter");
        meter.style.setProperty("--fill", (r.average / 5 * 100) + "%");
        meter.setAttribute("aria-label", "Average " + average + " of 5");
        board.querySelector(".count").textContent = "from " + plural(r.count, "rating", "ratings");
        Array.prototype.forEach.call(board.querySelectorAll(".bars button"), function (button) {
          var stars = Number(button.dataset.stars), n = (r.stars && r.stars[stars]) || 0;
          var percent = Math.round(r.count ? n / r.count * 100 : 0);
          button.querySelector(".n").textContent = n;
          button.querySelector(".pct").textContent = percent + "%";
          button.setAttribute("aria-label", plural(stars, "star", "stars") + ": " + plural(n, "rating", "ratings") + ", " + percent + " percent");
          var fill = button.querySelector(".fill");
          fill.style.minWidth = n ? "10px" : "0";
          // Set after the first paint, so the bars grow in from the left (the CSS skips it for reduced motion).
          requestAnimationFrame(function () { requestAnimationFrame(function () { fill.style.width = percent + "%"; }); });
        });
        board.hidden = false;
        var kept = notesBox.querySelector(".kept-private");
        var n = r.private || 0;
        kept.textContent = n === 1
          ? "Every rating counts. One came with a note sent privately, before notes were public: its stars are here, its words are not."
          : "Every rating counts. " + n + " came with notes sent privately, before notes were public: their stars are here, their words are not.";
        kept.hidden = !n;
      }
      function showList(data, append) {
        var list = notesBox.querySelector("ul.notes");
        if (!append) list.textContent = "";
        data.notes.forEach(function (note) { list.appendChild(noteItem(note)); });
        if (data.notes.length) browsing.last = data.notes[data.notes.length - 1].id;
        var more = notesBox.querySelector(".more");
        more.hidden = !data.more;
        more.disabled = false;
        more.textContent = "Show more notes";
        var line = notesBox.querySelector(".list-line"), stars = browsing.stars;
        line.textContent = "";
        var words = null;
        if (stars && !list.children.length) words = "No public notes with " + plural(stars, "star", "stars") + " yet.";
        else if (stars) words = plural(data.total, "note", "notes") + " with " + plural(stars, "star", "stars");
        else if (!list.children.length && !(data.ratings && data.ratings.count)) words = "No notes yet. Be the first to leave one below.";
        if (words) line.appendChild(document.createTextNode(words));
        if (stars) {
          var all = document.createElement("button");
          all.type = "button";
          all.textContent = "All notes";
          all.addEventListener("click", function () { loadNotes(null, null, false); });
          line.appendChild(all);
        }
        var bars = notesBox.querySelector(".bars");
        bars.classList.toggle("filtering", !!stars);
        Array.prototype.forEach.call(bars.querySelectorAll("button"), function (button) {
          button.setAttribute("aria-pressed", String(Number(button.dataset.stars) === stars));
        });
      }
      function showNotes(data) {
        if (!notesBox || !data || !data.notes) return;
        showRatings(data.ratings);
        showList(data, false);
        notesBox.hidden = false;
      }
      // A page of notes: [stars]'s or all, after the note [before] for the next page; [fresh] asks past the cache.
      function loadNotes(stars, before, fresh) {
        if (!notesBox || browsing.loading) return;
        browsing.loading = true;
        var query = [];
        if (stars) query.push("stars=" + stars);
        if (before) query.push("before=" + before);
        if (fresh) query.push("fresh=" + Date.now());
        if (before) { var more = notesBox.querySelector(".more"); more.disabled = true; more.textContent = "Loading…"; }
        fetch(notesBox.dataset.api + "/notes" + (query.length ? "?" + query.join("&") : ""), { credentials: "omit" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; })
          .then(function (data) {
            browsing.loading = false;
            if (!data || !data.notes) return;
            browsing.stars = stars;
            if (fresh) showRatings(data.ratings);
            showList(data, !!before);
            notesBox.hidden = false;
          });
      }
      if (notesBox) {
        Array.prototype.forEach.call(notesBox.querySelectorAll(".bars button"), function (button) {
          button.addEventListener("click", function () {
            var stars = Number(button.dataset.stars);
            loadNotes(browsing.stars === stars ? null : stars, null, false);
          });
        });
        notesBox.querySelector(".more").addEventListener("click", function () { loadNotes(browsing.stars, browsing.last, false); });
      }
      var stats = document.querySelector(".live-stats[data-api]");
      if (stats) {
        var api = stats.dataset.api;
        var asJson = function (r) { return r.ok ? r.json() : null; };
        var nothing = function () { return null; };
        Promise.all([
          fetch(api + "/visits", { method: "POST", credentials: "omit", cache: "no-store" }).then(asJson).catch(nothing),
          fetch(api + "/notes", { credentials: "omit" }).then(asJson).catch(nothing),
        ]).then(function (results) {
          var visits = results[0], notes = results[1];
          var parts = [];
          if (notes && notes.ratings && notes.ratings.count && notes.ratings.average != null) {
            var count = notes.ratings.count;
            parts.push("★ " + Number(notes.ratings.average).toFixed(1) + " from " + count + (count === 1 ? " rating" : " ratings"));
          }
          if (visits && visits.total) {
            var since = monthYear(visits.since);
            parts.push(visits.total.toLocaleString("en") + (visits.total === 1 ? " visit" : " visits") + (since ? " since " + since : ""));
          }
          if (parts.length) { stats.textContent = parts.join(" · "); stats.hidden = false; }
          showNotes(notes);
        });
      }
      var form = document.querySelector("form.feedback[data-api]");
      if (!form) return;
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var status = form.querySelector(".status");
        var button = form.querySelector("button");
        var note = {};
        new FormData(form).forEach(function (value, key) { note[key] = value; });
        if (note.rating === "") delete note.rating; else note.rating = Number(note.rating);
        note.consent = note.consent === "1";
        button.disabled = true;
        status.textContent = "Sending…";
        fetch(form.dataset.api + "/feedback", {
          method: "POST", credentials: "omit", headers: { "Content-Type": "application/json" }, body: JSON.stringify(note),
        })
          .then(function (r) { return r.json().then(function (body) { return { ok: r.ok, body: body }; }); })
          .then(function (r) {
            if (r.ok) { form.reset(); status.textContent = "Thanks, your note is up."; loadNotes(null, null, true); }
            else { status.textContent = (r.body && r.body.error) || "The note could not be sent. Try again, or email me."; }
          })
          .catch(function () { status.textContent = "The note could not be sent. Check the connection and try again."; })
          .then(function () { button.disabled = false; });
      });
    })();
  </script>
  <script>
    // The LinkedIn and GitHub links (data-track) count their clicks, middle clicks included: a beacon, which the browser
    // delivers even as the link takes the tab away, at most once per link per page load; the backend counts a visitor
    // once a day per link anyway. The private message form posts like the note form. Both only exist with an "api".
    (function () {
      var tracked = {};
      function track(event) {
        if (event.type === "auxclick" && event.button !== 1) return;
        var link = event.currentTarget, name = link.dataset.track;
        if (tracked[name] || !navigator.sendBeacon) return;
        tracked[name] = true;
        try { navigator.sendBeacon(link.dataset.api + "/clicks", JSON.stringify({ link: name })); } catch (e) {}
      }
      Array.prototype.forEach.call(document.querySelectorAll("a[data-track][data-api]"), function (link) {
        link.addEventListener("click", track);
        link.addEventListener("auxclick", track);
      });
      var form = document.querySelector("form.message[data-api]");
      if (!form) return;
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var status = form.querySelector(".status");
        var button = form.querySelector("button");
        var message = {};
        new FormData(form).forEach(function (value, key) { message[key] = value; });
        button.disabled = true;
        status.textContent = "Sending…";
        fetch(form.dataset.api + "/messages", {
          method: "POST", credentials: "omit", headers: { "Content-Type": "application/json" }, body: JSON.stringify(message),
        })
          .then(function (r) { return r.json().then(function (body) { return { ok: r.ok, body: body }; }); })
          .then(function (r) {
            if (r.ok) { form.reset(); status.textContent = "Thanks, your message is in. I'll reply to the contact you left."; }
            else { status.textContent = (r.body && r.body.error) || "The message could not be sent. Try again, or email me."; }
          })
          .catch(function () { status.textContent = "The message could not be sent. Check the connection and try again."; })
          .then(function () { button.disabled = false; });
      });
    })();
  </script>
  <script>
    (function () {
      // A minimal module declaring a GC struct type: validates only where WasmGC (required by Kotlin/Wasm) exists.
      var gc = typeof WebAssembly === "object" &&
        WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]));
      function staticOnly() { document.body.classList.add("static-only"); }
      if (!gc) return staticOnly();
      var started = false;
      function start() {
        if (started) return;
        started = true;
        var script = document.createElement("script");
        // The build id in the query gives each deploy's script its own URL. GitHub Pages caches every file for ten
        // minutes, so an unversioned composeApp.js could be the previous deploy's, pointing at wasm files that are
        // gone (those are content-hashed already); this one is always the script this index.html was built with.
        script.src = "composeApp.js?v={{build}}";
        script.onerror = staticOnly;
        document.body.appendChild(script);
      }
      // Start the multi-megabyte app only after the static page's first contentful paint, so it never competes
      // with that paint for bandwidth; Lighthouse's simulated LCP otherwise waited on the whole Wasm download.
      // The timeout covers browsers that never report the paint (e.g. a tab opened in the background).
      try {
        new PerformanceObserver(function (list, observer) {
          if (list.getEntriesByName("first-contentful-paint").length) {
            observer.disconnect();
            setTimeout(start, 0);
          }
        }).observe({ type: "paint", buffered: true });
      } catch (e) {
        start();
      }
      setTimeout(start, 3000);
    })();
  </script>
