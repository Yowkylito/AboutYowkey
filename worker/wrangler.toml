# The portfolio's backend. Setup and the owner's commands: docs/DEVELOPMENT.md, "Visits and feedback".
# Secrets (ADMIN_TOKEN, VISITOR_SALT) are set with `npx wrangler secret put <NAME>`, never written here. So is the
# optional FCM_SERVICE_ACCOUNT, the Firebase service-account key (JSON) that lets the worker push alerts to the
# owner's phone: `npx wrangler secret put FCM_SERVICE_ACCOUNT < key.json`. Without it, alerts are only records the
# owner's app polls.
name = "aboutyowkey-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "aboutyowkey"
# Paste the id that `npx wrangler d1 create aboutyowkey` prints. The placeholder is enough for `npm run dev`,
# which uses a local SQLite file under .wrangler/.
database_id = "c5449c6a-b33c-4d07-a92c-1570eefa0eff"
migrations_dir = "migrations"

[vars]
# The pages that may call the API from a browser, comma-separated. The second is the local dist server (docs/DEVELOPMENT.md, "Run it").
ALLOWED_ORIGINS = "https://yowkylito.github.io,http://localhost:8080"
# Where a plain form post (a browser without the page's script) is sent back to.
SITE_URL = "https://yowkylito.github.io/AboutYowkey/"
# The owner's time zone: visits, clicks, notes and messages are counted by its date, and the daily report is about it.
TIME_ZONE = "Asia/Manila"
# The links on the page whose clicks are counted (POST /clicks), comma-separated, lowercase.
TRACKED_LINKS = "linkedin,github"
# Anti-spam: one note per address (a daily hash of its network, not the browser) every this many minutes, on top of 5 a day.
NOTE_GAP_MINUTES = "5"

[triggers]
# The daily report. Cron times are UTC: 15:59 UTC is 23:59 in Asia/Manila (UTC+8 all year, no daylight saving).
crons = ["59 15 * * *"]
